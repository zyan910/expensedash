<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Expense Dashboard</title>
  
  <!-- PDF.js Library for Local File Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; }

    body {
      margin: 0; padding: 24px 16px 48px; font-family: 'Inter', -apple-system, sans-serif;
      background: radial-gradient(ellipse 120% 280px at 50% 0px, rgba(145, 28, 52, 0.55) 0%, rgba(145, 28, 52, 0.15) 55%, transparent 100%), #000000;
      background-attachment: fixed; color: #F1F5F9; -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 620px; margin: 0 auto; }
    .header-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #94A3B8; margin-bottom: 4px; font-weight: 700; }
    .header-title { font-size: 24px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.02em; margin-bottom: 20px; }

    /* Upload Zone */
    .upload-zone {
      border: 2px dashed rgba(145, 28, 52, 0.5); border-radius: 20px; padding: 40px 20px; 
      text-align: center; background: rgba(255,255,255,0.03); margin-top: 20px; transition: 0.3s;
    }
    .upload-zone.processing { border-color: #4ADE80; background: rgba(74, 222, 128, 0.05); }
    .upload-btn {
      background: linear-gradient(135deg, #911c34 0%, #610e20 100%); color: white; padding: 12px 24px; 
      border-radius: 10px; font-weight: 700; display: inline-block; cursor: pointer; margin-top: 16px;
    }
    input[type="file"] { display: none; }

    /* Dashboard UI Elements */
    .main-card {
      border-radius: 20px; padding: 22px 24px; margin-bottom: 16px;
      background: linear-gradient(135deg, rgba(145, 28, 52, 0.35) 0%, rgba(18, 18, 18, 0.8) 100%);
      border: 1px solid rgba(145, 28, 52, 0.5); box-shadow: 0 10px 30px -10px rgba(145, 28, 52, 0.4);
      backdrop-filter: blur(12px);
    }
    .card-title { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 800; margin-bottom: 4px; color: #FF7B95; }
    .card-subtitle { font-size: 11px; color: #CBD5E1; margin-bottom: 14px; font-weight: 600; }
    .card-total { font-size: 38px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 16px; line-height: 1; color: #FFFFFF; text-shadow: 0 0 20px rgba(145, 28, 52, 0.3); }
    
    /* Restored CSS Classes */
    .progress-bar { display: flex; border-radius: 8px; overflow: hidden; height: 8px; gap: 2px; background: rgba(0,0,0,0.4); padding: 1px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 24px; }
    .stat-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 14px; padding: 12px 10px; text-align: center; }
    .stat-num { font-size: 15px; font-weight: 800; color: #F8FAFC; margin-bottom: 2px; }
    .stat-lbl { font-size: 9px; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 0.06em; }

    .split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .split-card { border-radius: 16px; padding: 16px 18px; backdrop-filter: blur(8px); }
    .split-card.recurring { background: rgba(34, 197, 94, 0.07); border: 1px solid rgba(34, 197, 94, 0.28); }
    .split-card.onetime { background: rgba(145, 28, 52, 0.15); border: 1px solid rgba(145, 28, 52, 0.45); }
    .split-label { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
    .recurring .split-label { color: #4ADE80; }
    .onetime .split-label { color: #FF7B95; }
    .split-value { font-size: 20px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.01em; }
    .split-desc { font-size: 10px; color: #94A3B8; margin-top: 4px; font-weight: 600; }

    details {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px; margin-bottom: 10px; overflow: hidden; transition: 0.3s ease;
    }
    details[open] {
      background: #141414; border-color: var(--cat-color);
      box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.8), 0 0 12px -2px var(--cat-color);
    }
    summary { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; cursor: pointer; list-style: none; user-select: none; }
    summary::-webkit-details-marker { display: none; }
    .cat-left { display: flex; align-items: center; gap: 12px; }
    .cat-icon { font-size: 20px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.04); border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); }
    .cat-name { font-size: 13.5px; font-weight: 700; color: #F1F5F9; }
    .cat-count { font-size: 10px; color: #64748B; margin-top: 2px; font-weight: 600; }
    .cat-right { text-align: right; }
    .cat-amount { font-size: 14.5px; font-weight: 800; color: #FFFFFF; }
    .cat-pct { font-size: 10px; font-weight: 700; color: var(--cat-color); margin-top: 2px; }
    .cat-bar-bg { background: rgba(255, 255, 255, 0.06); border-radius: 4px; height: 3px; margin: 0 18px 4px 18px; }
    .cat-bar-fill { height: 100%; border-radius: 4px; background: var(--cat-color); }

    details[open] .details-wrapper { animation: slideDown 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes slideDown { 0% { opacity: 0; transform: translateY(-8px); max-height: 0; } 100% { opacity: 1; transform: translateY(0); max-height: 800px; } }

    .merchants-list { padding: 10px 18px 16px 18px; border-top: 1px solid rgba(255,255,255,0.06); margin-top: 10px; max-height: 380px; overflow-y: auto; }
    .merchants-list::-webkit-scrollbar { width: 4px; }
    .merchants-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    .merchant-item { font-size: 11.5px; color: #A1A1AA; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); }
    .merchant-item:last-child { border-bottom: none; margin-bottom: 0; }
    .m-left { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .m-name { color: #E4E4E7; font-weight: 600; }
    .m-date { font-size: 9.5px; color: #71717A; font-weight: 500; margin-left: 4px; }
    .merchant-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--cat-color); flex-shrink: 0; }
    .m-amt { font-weight: 700; color: #F4F4F5; white-space: nowrap; margin-left: 8px; }

    .footer { text-align: center; margin-top: 28px; font-size: 11px; color: #64748B; font-weight: 600; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <div class="container">
    <!-- These IDs allow JS to inject the dynamic month/year -->
    <div class="header-label" id="main-header-label">HSBC Statement Parser</div>
    <div class="header-title" id="main-header-title">Expense Dashboard</div>

    <div class="upload-zone" id="drop-zone">
      <div style="font-size: 40px; margin-bottom: 10px;" id="upload-icon">📄</div>
      <div style="font-weight: 600;" id="upload-text">Upload HSBC Statement (PDF)</div>
      <div style="font-size: 12px; color: #94A3B8; margin-top: 8px;">Processed securely on your device. No cloud storage.</div>
      <label class="upload-btn">
        Select PDF File
        <input type="file" id="file-input" accept="application/pdf">
      </label>
    </div>

    <div id="dashboard-output" style="display: none; margin-top: 0px;"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    const categoryMeta = {
      "Dining & Cafes": { icon: "🍽️", color: "#EC4899" },
      "Fuel": { icon: "⛽", color: "#EAB308" },
      "Services & Driving": { icon: "🚘", color: "#84CC16" },
      "Government & Services": { icon: "🏛️", color: "#475569" },
      "Travel & Stays": { icon: "✈️", color: "#0EA5E9" },
      "Shopping": { icon: "🛍️", color: "#8B5CF6" },
      "Services & Freight": { icon: "📦", color: "#A855F7" },
      "Personal Care": { icon: "💇", color: "#F43F5E" },
      "Automotive & Tuning": { icon: "🚗", color: "#F97316" },
      "Transport": { icon: "🚕", color: "#22D3EE" },
      "Groceries": { icon: "🛒", color: "#22C55E" },
      "Subscriptions": { icon: "📱", color: "#64748B" }
    };

    const oneTimeCategories = ["Services & Driving", "Travel & Stays", "Services & Freight", "Automotive & Tuning"];

    document.getElementById('file-input').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      document.getElementById('drop-zone').classList.add('processing');
      document.getElementById('upload-text').innerText = "Analyzing Statement...";
      document.getElementById('upload-icon').innerText = "⚙️";

      const reader = new FileReader();
      reader.onload = async function() {
        const typedarray = new Uint8Array(this.result);
        const pdf = await pdfjsLib.getDocument(typedarray).promise;
        
        let rawText = "";
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          rawText += textContent.items.map(item => item.str).join(" ") + " ";
        }

        processTransactions(rawText);
      };
      reader.readAsArrayBuffer(file);
    });

    function formatStandardDate(dateStr) {
      const parts = dateStr.split('-');
      if(parts.length !== 3) return dateStr;
      return `${parts[0].padStart(2, '0')} ${parts[1]} 20${parts[2]}`;
    }

    function processTransactions(text) {
      const regex = /(\d{2}-[a-zA-Z]{3}-\d{2})\s+(?:\d{2}-[a-zA-Z]{3}-\d{2})?\s+(.*?)\s+(\d{1,3}(?:,\d{3})*\.\d{2})\s*(CR)?/g;
      
      let transactions = [];
      let match;
      
      while ((match = regex.exec(text)) !== null) {
        if (match[4] === "CR") continue; 
        
        const rawDate = match[1];
        let merchant = match[2].trim().replace(/NFC - \(AP-PAY\)-|IAP - \(AP-PAY\)-/, '').trim(); 
        const amount = parseFloat(match[3].replace(',', ''));
        
        if (merchant.toLowerCase().includes("opening balance") || merchant.toLowerCase().includes("cashback")) continue;

        let category = categorize(merchant, amount);
        let finalMerchant = formatMerchant(merchant, amount);
        
        transactions.push({
          date: formatStandardDate(rawDate),
          rawDateObj: new Date(formatStandardDate(rawDate)),
          merchant: finalMerchant,
          amount: amount,
          category: category
        });
      }

      // Extract statement Month/Year dynamically from the latest transaction
      let statementMonth = "Current";
      let statementYear = "Dashboard";
      if (transactions.length > 0) {
        let maxDate = new Date(Math.max.apply(null, transactions.map(t => t.rawDateObj)));
        statementMonth = maxDate.toLocaleString('en-US', { month: 'long' });
        statementYear = maxDate.getFullYear();
      }

      renderDashboard(transactions, statementMonth, statementYear);
    }

    function categorize(merchant, amount) {
      const m = merchant.toLowerCase();
      if (m.includes("digital") || m.includes("smart") || m.includes("authority")) return "Government & Services";
      if (m.includes("mcdonald") || m.includes("pizza") || m.includes("burger") || m.includes("cafe") || m.includes("zomato") || m.includes("talabat") || m.includes("restaurant") || m.includes("careem food") || m.includes("careem deliveries")) return "Dining & Cafes";
      if (m.includes("enoc") || m.includes("adnoc") || m.includes("eppco")) return "Fuel";
      if (m.includes("belhasa")) return "Services & Driving";
      if (m.includes("hotel") || m.includes("marriott") || m.includes("airbnb")) return "Travel & Stays";
      if (m.includes("marks") || m.includes("noon.com") || m.includes("amazon")) return "Shopping";
      if (m.includes("fedex") || m.includes("courier")) return "Services & Freight";
      if (m.includes("hair") || m.includes("salon") || m.includes("fiddi") || m.includes("pharmacy")) return "Personal Care";
      if (m.includes("auto") || m.includes("car wash") || m.includes("parking") && !m.includes("digital")) return "Automotive & Tuning";
      if (m.includes("careem hala") || m.includes("taxi") || m.includes("uber")) return "Transport";
      if (m.includes("supermarket") || m.includes("grocery") || m.includes("mart")) return "Groceries";
      if (m.includes("careem plus") || m.includes("subscription") || m.includes("netflix") || m.includes("spotify")) return "Subscriptions";
      
      return "Shopping";
    }

    function formatMerchant(merchant, amount) {
      const m = merchant.toLowerCase();
      if (m.includes("digital") || m.includes("smart") || m.includes("authority")) {
        if ([50, 75, 100, 120].includes(amount)) return "Digital Dubai (Salik Recharge)";
        if (amount === 220) return "Dubai Digital Authority (Govt Fee)";
        if (amount % 1 !== 0) return "Digital Dubai (Parkin Payment)";
        return "Digital Dubai (Nol Card Recharge)";
      }
      return merchant;
    }

    function renderDashboard(txs, month, year) {
      // Hide upload zone & dynamically rewrite headers
      document.getElementById('drop-zone').style.display = 'none';
      document.getElementById('main-header-label').innerText = "HSBC Live+ Statement Analysis";
      document.getElementById('main-header-title').innerText = `${month} ${year} Dashboard`;

      const output = document.getElementById('dashboard-output');
      output.style.display = 'block';

      if (txs.length === 0) {
        output.innerHTML = "<div style='text-align:center;'>No transactions detected. Ensure the file is an HSBC statement PDF.</div>";
        return;
      }

      let totalSpend = 0, usualTotal = 0, oneTimeTotal = 0, usualCount = 0, oneTimeCount = 0;
      let catData = {};

      txs.forEach(t => {
        totalSpend += t.amount;
        if (oneTimeCategories.includes(t.category)) {
          oneTimeTotal += t.amount;
          oneTimeCount++;
        } else {
          usualTotal += t.amount;
          usualCount++;
        }

        if (!catData[t.category]) catData[t.category] = { total: 0, items: [] };
        catData[t.category].total += t.amount;
        catData[t.category].items.push(t);
      });

      let usualPct = ((usualTotal / totalSpend) * 100).toFixed(1);
      let oneTimePct = ((oneTimeTotal / totalSpend) * 100).toFixed(1);
      
      // Filter out isolated high spend days to get a better daily average
      let uniqueDays = [...new Set(txs.map(t => t.date))].length;
      let dailyAvg = uniqueDays > 0 ? Math.round(totalSpend / uniqueDays) : Math.round(totalSpend / 30);

      // Sort categories
      let sortedCats = Object.entries(catData).sort((a, b) => b[1].total - a[1].total);
      
      let html = `
        <div class="main-card">
          <div class="card-title">Statement Outflows</div>
          <div class="card-subtitle">Parsed automatically from PDF</div>
          <div class="card-total">AED ${totalSpend.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
          <div class="progress-bar">
      `;

      sortedCats.forEach(([cName, cObj]) => {
        const meta = categoryMeta[cName] || { color: "#A855F7" };
        const pct = ((cObj.total / totalSpend) * 100).toFixed(1);
        html += `<div style="width: ${pct}%; background: ${meta.color};" title="${cName}: ${pct}%"></div>`;
      });
      
      html += `</div></div>
        <div class="split-grid">
          <div class="split-card recurring">
            <div class="split-label">Usual Spends</div>
            <div class="split-value">AED ${usualTotal.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
            <div class="split-desc">${usualPct}% · ${usualCount} Txs</div>
          </div>
          <div class="split-card onetime">
            <div class="split-label">One-Time Spends</div>
            <div class="split-value">AED ${oneTimeTotal.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
            <div class="split-desc">${oneTimePct}% · ${oneTimeCount} Txs</div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-num">AED ${dailyAvg}</div>
            <div class="stat-lbl">Daily Avg</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">${txs.length}</div>
            <div class="stat-lbl">Txn Count</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" style="color: ${sortedCats[0] ? (categoryMeta[sortedCats[0][0]]?.color || '#EC4899') : '#EC4899'};">
              ${sortedCats[0] ? ((sortedCats[0][1].total / totalSpend)*100).toFixed(1) : 0}%
            </div>
            <div class="stat-lbl">Top: ${sortedCats[0] ? sortedCats[0][0].split(' ')[0] : 'N/A'}</div>
          </div>
        </div>

        <div class="header-label" style="margin-bottom: 12px;">Tap any category to inspect transactions</div>
      `;

      sortedCats.forEach(([cName, cObj]) => {
        const meta = categoryMeta[cName] || { icon: "🧾", color: "#A855F7" };
        const pct = ((cObj.total / totalSpend) * 100).toFixed(1);
        
        let itemsHtml = "";
        cObj.items.sort((a, b) => b.amount - a.amount).forEach(item => {
          itemsHtml += `
            <div class="merchant-item">
              <div class="m-left"><div class="merchant-dot"></div><span class="m-name">${item.merchant}</span><span class="m-date">${item.date}</span></div>
              <div class="m-amt">AED ${item.amount.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
            </div>`;
        });

        html += `
          <details style="--cat-color: ${meta.color};">
            <summary>
              <div class="cat-left"><span class="cat-icon">${meta.icon}</span><div><div class="cat-name">${cName}</div><div class="cat-count">${cObj.items.length} tx</div></div></div>
              <div class="cat-right"><div class="cat-amount">AED ${cObj.total.toLocaleString('en-US', {minimumFractionDigits: 2})}</div><div class="cat-pct">${pct}%</div></div>
            </summary>
            <div class="cat-bar-bg"><div class="cat-bar-fill" style="width: ${pct}%;"></div></div>
            <div class="details-wrapper"><div class="merchants-list">${itemsHtml}</div></div>
          </details>`;
      });

      html += `<div class="footer">HSBC Live+ · ${month} ${year}</div>`;
      output.innerHTML = html;
    }
  </script>
</body>
</html>
