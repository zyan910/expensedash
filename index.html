<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Expense Dashboard</title>
  
  <!-- PDF.js Library for Local File Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  
  <style id="dashboard-styles">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; }

    html { background-color: #000000; }

    body {
      margin: 0; padding: 0 16px 48px; font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh; min-height: 100dvh;
      background: radial-gradient(ellipse 120% 280px at 50% 0px, rgba(145, 28, 52, 0.55) 0%, rgba(145, 28, 52, 0.15) 55%, transparent 100%), #000000;
      background-attachment: fixed; color: #F1F5F9; -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .container { max-width: 620px; margin: 0 auto; position: relative; }

    /* Smooth View Transitions */
    .view-panel {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0; visibility: hidden; position: absolute; width: 100%; top: 0; left: 0;
      transform: translateY(15px) scale(0.98);
    }
    .view-panel.active {
      opacity: 1; visibility: visible; position: relative;
      transform: translateY(0) scale(1);
    }

    #view-upload { padding-top: calc(24px + env(safe-area-inset-top)); }

    /* Frosted Glass Sticky Header */
    .sticky-header {
      position: -webkit-sticky; position: sticky; top: 0; z-index: 100;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      margin: 0 -16px 16px -16px;
      padding: calc(16px + env(safe-area-inset-top)) 16px 16px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    /* Top Action Bar */
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 8px; flex-wrap: wrap; }
    .action-group { display: flex; gap: 8px; }
    
    .action-btn {
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
      color: #F1F5F9; padding: 8px 14px; border-radius: 10px; font-size: 12px;
      font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      transition: 0.2s ease; backdrop-filter: blur(8px);
    }
    .action-btn:hover { background: rgba(255, 255, 255, 0.12); }
    .action-btn.save-html-btn { background: rgba(145, 28, 52, 0.35); border-color: rgba(255, 123, 149, 0.4); color: #FFD1DA; }
    .action-btn.save-csv-btn { background: rgba(34, 197, 94, 0.2); border-color: rgba(74, 222, 128, 0.4); color: #86EFAC; }

    .header-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #94A3B8; margin-bottom: 4px; font-weight: 700; }
    .header-title { font-size: 24px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.02em; margin-bottom: 16px; }

    /* Search Bar */
    .search-container { margin-bottom: 0px; }
    .search-input {
      width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      padding: 12px 16px; border-radius: 14px; color: #FFF; font-family: inherit; font-size: 14px;
      outline: none; transition: 0.2s; backdrop-filter: blur(8px);
    }
    .search-input:focus { border-color: #FF7B95; background: rgba(255,255,255,0.08); }
    .search-input::placeholder { color: #64748B; }

    /* Upload Zone */
    .upload-zone {
      border: 2px dashed rgba(145, 28, 52, 0.5); border-radius: 20px; padding: 40px 20px; 
      text-align: center; background: rgba(255,255,255,0.03); margin-top: 20px; transition: 0.3s;
    }
    .upload-zone.processing { border-color: #4ADE80; background: rgba(74, 222, 128, 0.05); }
    .upload-btn {
      background: linear-gradient(135deg, #911c34 0%, #610e20 100%); color: white; padding: 12px 24px; 
      border-radius: 10px; font-weight: 700; display: inline-block; cursor: pointer; margin-top: 16px;
    }
    input[type="file"] { display: none; }

    /* Dashboard UI Elements */
    .main-card {
      border-radius: 20px; padding: 22px 24px; margin-bottom: 16px; position: relative;
      background: linear-gradient(135deg, rgba(145, 28, 52, 0.35) 0%, rgba(18, 18, 18, 0.8) 100%);
      border: 1px solid rgba(145, 28, 52, 0.5); box-shadow: 0 10px 30px -10px rgba(145, 28, 52, 0.4);
      backdrop-filter: blur(12px);
    }
    .card-title { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 800; margin-bottom: 4px; color: #FF7B95; }
    .card-subtitle { font-size: 11px; color: #CBD5E1; margin-bottom: 14px; font-weight: 600; }
    .card-total { font-size: 38px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 20px; line-height: 1; color: #FFFFFF; text-shadow: 0 0 20px rgba(145, 28, 52, 0.3); }

    .trend-badge {
      display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .trend-up { background: rgba(244, 63, 94, 0.15); color: #FDA4AF; border: 1px solid rgba(244, 63, 94, 0.3); }
    .trend-down { background: rgba(74, 222, 128, 0.15); color: #86EFAC; border: 1px solid rgba(74, 222, 128, 0.3); }

    .progress-bar { 
      display: flex; border-radius: 12px; overflow: hidden; height: 14px; 
      gap: 3px; background: rgba(0,0,0,0.4); padding: 3px;
    }
    .progress-segment { border-radius: 8px; height: 100%; transition: width 0.4s ease; }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 24px; }
    .stat-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 14px; padding: 12px 10px; text-align: center; }
    .stat-num { font-size: 15px; font-weight: 800; color: #F8FAFC; margin-bottom: 2px; }
    .stat-lbl { font-size: 9px; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 0.06em; }

    .split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .split-card { border-radius: 16px; padding: 16px 18px; backdrop-filter: blur(8px); }
    .split-card.recurring { background: rgba(34, 197, 94, 0.07); border: 1px solid rgba(34, 197, 94, 0.28); }
    .split-card.onetime { background: rgba(145, 28, 52, 0.15); border: 1px solid rgba(145, 28, 52, 0.45); }
    .split-label { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
    .recurring .split-label { color: #4ADE80; }
    .onetime .split-label { color: #FF7B95; }
    .split-value { font-size: 20px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.01em; }
    .split-desc { font-size: 10px; color: #94A3B8; margin-top: 4px; font-weight: 600; }

    details {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px; margin-bottom: 10px; overflow: hidden; transition: 0.3s ease;
    }
    details[open] {
      background: #141414; border-color: var(--cat-color);
      box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.8), 0 0 12px -2px var(--cat-color);
    }
    summary { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; cursor: pointer; list-style: none; user-select: none; }
    summary::-webkit-details-marker { display: none; }
    .cat-left { display: flex; align-items: center; gap: 12px; }
    .cat-icon { font-size: 20px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.04); border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); }
    .cat-name { font-size: 13.5px; font-weight: 700; color: #F1F5F9; }
    .cat-count { font-size: 10px; color: #64748B; margin-top: 2px; font-weight: 600; }
    .cat-right { text-align: right; }
    .cat-amount { font-size: 14.5px; font-weight: 800; color: #FFFFFF; }
    .cat-pct { font-size: 10px; font-weight: 700; color: var(--cat-color); margin-top: 2px; }
    
    .cat-bar-bg { background: rgba(255, 255, 255, 0.06); border-radius: 4px; height: 3px; margin: 0 18px 4px 18px; }
    .cat-bar-fill { height: 100%; border-radius: 4px; background: var(--cat-color); }

    details[open] .details-wrapper { animation: slideDown 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes slideDown { 0% { opacity: 0; transform: translateY(-8px); max-height: 0; } 100% { opacity: 1; transform: translateY(0); max-height: 800px; } }

    .merchants-list { padding: 10px 18px 16px 18px; border-top: 1px solid rgba(255,255,255,0.06); margin-top: 10px; max-height: 380px; overflow-y: auto; }
    .merchants-list::-webkit-scrollbar { width: 4px; }
    .merchants-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    .merchant-item { 
      font-size: 11.5px; color: #A1A1AA; display: flex; align-items: center; 
      justify-content: space-between; margin-bottom: 8px; padding: 6px 0; 
      border-bottom: 1px dashed rgba(255,255,255,0.05); 
    }
    .merchant-item:last-child { border-bottom: none; margin-bottom: 0; }
    .m-left { display: flex; align-items: center; gap: 8px; font-weight: 500; min-width: 0; }
    
    .flag-btn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: #94A3B8; border-radius: 6px; font-size: 10px; cursor: pointer;
      width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
      transition: 0.2s; flex-shrink: 0;
    }
    .flag-btn.flagged { background: rgba(59, 130, 246, 0.2); border-color: rgba(59, 130, 246, 0.5); }
    .merchant-item.is-flagged .m-name { color: #64748B; text-decoration: line-through; }
    
    .m-name { 
      color: #E4E4E7; font-weight: 600; overflow: hidden; text-overflow: ellipsis; 
      cursor: pointer; transition: 0.2s; border-bottom: 1px dashed transparent;
    }
    .m-name:hover { color: #FFF; border-bottom-color: #64748B; }
    .m-date { font-size: 9.5px; color: #71717A; font-weight: 500; margin-left: 4px; white-space: nowrap; }
    .merchant-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--cat-color); flex-shrink: 0; }
    .m-amt { font-weight: 700; color: #F4F4F5; white-space: nowrap; margin-left: 8px; }

    .footer { text-align: center; font-size: 11px; color: #64748B; font-weight: 600; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <div class="container" id="app-container">
    
    <!-- UPLOAD PANEL -->
    <div id="view-upload" class="view-panel active">
      <div class="header-label">Offline PDF Engine</div>
      <div class="header-title">Expense Dash</div>

      <div class="upload-zone" id="drop-zone">
        <div style="font-size: 40px; margin-bottom: 10px;" id="upload-icon">📁</div>
        <div style="font-weight: 600;" id="upload-text">Upload Credit Card Statements</div>
        <div style="font-size: 12px; color: #94A3B8; margin-top: 8px;">Select one or multiple PDFs for a single or consolidated dashboard.</div>
        <label class="upload-btn">
          Select PDF File(s)
          <input type="file" id="file-input" accept="application/pdf" multiple>
        </label>
      </div>
      
      <div class="footer" style="margin-top: 24px;" id="version-tag"></div>
    </div>

    <!-- DASHBOARD PANEL -->
    <div id="view-dashboard" class="view-panel">
      
      <div class="sticky-header">
        <div class="top-bar">
          <button class="action-btn" id="back-btn" type="button">← Back</button>
          <div class="action-group">
            <button class="action-btn save-csv-btn" id="save-csv-btn" type="button">↓ CSV</button>
            <button class="action-btn save-html-btn" id="save-html-btn" type="button">↓ HTML</button>
          </div>
        </div>
        <div class="header-label" id="main-header-label">Statements Analysis</div>
        <div class="header-title" id="main-header-title">Expense Dashboard</div>
        <div class="search-container">
          <input type="text" id="search-input" class="search-input" placeholder="🔍 Search merchants or categories...">
        </div>
      </div>

      <div id="dashboard-output" style="margin-top: 0px;"></div>
    </div>

  </div>

  <script>
    const APP_VERSION = "v0.9.5";
    document.getElementById('version-tag').innerText = APP_VERSION;
    
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    const categoryMeta = {
      "Dining & Cafes": { icon: "🍽️", color: "#EC4899" },
      "Shopping": { icon: "🛍️", color: "#8B5CF6" },
      "Fuel": { icon: "⛽", color: "#EAB308" },
      "Transport": { icon: "🚕", color: "#22D3EE" },
      "Groceries": { icon: "🛒", color: "#22C55E" },
      "Subscriptions": { icon: "🔄", color: "#64748B" },
      "Government & Utilities": { icon: "🏛️", color: "#475569" },
      "Automotive & Tuning": { icon: "🚗", color: "#F97316" },
      "Services & Driving": { icon: "🚘", color: "#84CC16" },
      "Education & Professional": { icon: "🎓", color: "#6366F1" },
      "Travel & Stays": { icon: "✈️", color: "#0EA5E9" },
      "Services & Freight": { icon: "📦", color: "#A855F7" },
      "Personal Care": { icon: "💇", color: "#F43F5E" },
      "Entertainment": { icon: "🎳", color: "#D946EF" },
      "Traffic Fines": { icon: "🚨", color: "#EF4444" },
      "Misc & Other": { icon: "🔖", color: "#64748B" },
      "Reimbursable": { icon: "💼", color: "#3B82F6" }
    };

    const oneTimeCategories = [
      "Education & Professional",
      "Services & Driving",
      "Travel & Stays",
      "Services & Freight",
      "Automotive & Tuning",
      "Traffic Fines"
    ];

    let currentExportFilename = "Expense_Dashboard";
    
    // Global State for UI
    let globalTransactions = []; 
    let globalMonth = "";
    let globalYear = "";
    let globalFileCount = 0;
    let globalCardNames = [];
    
    // Load Local Storage Memory
    let merchantAliases = JSON.parse(localStorage.getItem('merchantAliases')) || {};
    let reimbursableFlags = JSON.parse(localStorage.getItem('reimbursableFlags')) || {};

    // View Transitions
    function switchView(fromId, toId) {
      const fromEl = document.getElementById(fromId);
      const toEl = document.getElementById(toId);
      fromEl.classList.remove('active');
      setTimeout(() => {
        toEl.classList.add('active');
        window.scrollTo(0, 0);
      }, 200);
    }

    document.getElementById('back-btn').addEventListener('click', function() {
      switchView('view-dashboard', 'view-upload');
      setTimeout(() => {
        document.getElementById('dashboard-output').innerHTML = '';
        document.getElementById('search-input').value = '';
        const dropZone = document.getElementById('drop-zone');
        dropZone.classList.remove('processing');
        document.getElementById('upload-icon').innerText = '📁';
        document.getElementById('upload-text').innerText = 'Upload Credit Card Statements';
        document.getElementById('file-input').value = '';
      }, 400);
    });

    // Exports
    document.getElementById('save-html-btn').addEventListener('click', function() {
      const styles = document.getElementById('dashboard-styles').innerHTML;
      const headerLabel = document.getElementById('main-header-label').innerText;
      const headerTitle = document.getElementById('main-header-title').innerText;
      const dashboardHtml = document.getElementById('dashboard-output').innerHTML;
      const searchHtml = document.querySelector('.search-container').innerHTML;

      const standaloneHtml = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${headerTitle} - ${headerLabel}</title>
  <style>${styles}</style>
</head>
<body>
  <div class="container">
    <div class="header-label">${headerLabel}</div>
    <div class="header-title">${headerTitle}</div>
    <div class="search-container">${searchHtml}</div>
    <div>${dashboardHtml}</div>
  </div>
</body>
</html>`;
      downloadFile(standaloneHtml, `${currentExportFilename}.html`, 'text/html;charset=utf-8');
    });

    document.getElementById('save-csv-btn').addEventListener('click', function() {
      if(globalTransactions.length === 0) return;
      let csvContent = "Date,Merchant,Category,Reimbursable,Amount,Card\n";
      globalTransactions.forEach(t => {
        const safeMerchant = `"${t.merchant.replace(/"/g, '""')}"`;
        const isReimbursable = reimbursableFlags[t.txId] ? "Yes" : "No";
        csvContent += `${t.date},${safeMerchant},${t.category},${isReimbursable},${t.amount},${t.card}\n`;
      });
      downloadFile(csvContent, `${currentExportFilename}.csv`, 'text/csv;charset=utf-8');
    });

    function downloadFile(content, filename, type) {
      const blob = new Blob([content], { type: type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Interactive Search Filtering
    document.getElementById('search-input').addEventListener('input', function(e) {
      const term = e.target.value.toLowerCase();
      if (!term) {
        renderDashboardCore(globalTransactions);
        return;
      }
      const filteredTxs = globalTransactions.filter(t => 
        t.merchant.toLowerCase().includes(term) || 
        t.category.toLowerCase().includes(term) ||
        t.amount.toString().includes(term) ||
        t.date.toLowerCase().includes(term)
      );
      renderDashboardCore(filteredTxs);
    });

    // Custom Alias Handler
    window.renameMerchant = function(el) {
      const currentName = el.innerText;
      const newName = prompt(`Rename "${currentName}" to:\n(This will be remembered for all future uploads)`, currentName);
      
      if (newName && newName.trim() !== "" && newName !== currentName) {
        merchantAliases[currentName] = newName.trim();
        localStorage.setItem('merchantAliases', JSON.stringify(merchantAliases));
        
        globalTransactions.forEach(t => {
          if(t.merchant === currentName) {
            t.merchant = newName.trim();
            t.category = categorize(t.merchant, t.amount);
          }
        });
        
        const term = document.getElementById('search-input').value.toLowerCase();
        if (term) {
          const filteredTxs = globalTransactions.filter(t => t.merchant.toLowerCase().includes(term) || t.category.toLowerCase().includes(term));
          renderDashboardCore(filteredTxs);
        } else {
          renderDashboardCore(globalTransactions);
        }
      }
    };

    // Flag Handler
    window.toggleFlag = function(txId) {
      if (reimbursableFlags[txId]) {
        delete reimbursableFlags[txId];
      } else {
        reimbursableFlags[txId] = true;
      }
      localStorage.setItem('reimbursableFlags', JSON.stringify(reimbursableFlags));
      
      const term = document.getElementById('search-input').value.toLowerCase();
      if (term) {
        const filteredTxs = globalTransactions.filter(t => t.merchant.toLowerCase().includes(term) || t.category.toLowerCase().includes(term));
        renderDashboardCore(filteredTxs);
      } else {
        renderDashboardCore(globalTransactions);
      }
    };

    // File Upload Handler
    document.getElementById('file-input').addEventListener('change', async function(e) {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;
      
      document.getElementById('drop-zone').classList.add('processing');
      document.getElementById('upload-text').innerText = `Analyzing ${files.length} Statement(s)...`;
      document.getElementById('upload-icon').innerText = "⚙️";

      let allTransactions = [];
      let detectedCards = new Set();
      let detectedPeriodEnd = null;

      for (let f = 0; f < files.length; f++) {
        const file = files[f];
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument(new Uint8Array(arrayBuffer)).promise;
        
        let combinedRawText = "";
        
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          
          if (i === 1) {
            const page1Text = textContent.items.map(item => item.str).join(" ");
            const cardName = extractCardName(page1Text);
            if (cardName) detectedCards.add(cardName);

            const periodEnd = extractStatementPeriodEnd(page1Text);
            if (periodEnd && (!detectedPeriodEnd || periodEnd > detectedPeriodEnd)) {
              detectedPeriodEnd = periodEnd;
            }
          }
          
          combinedRawText += textContent.items.map(item => item.str).join(" ") + " ";
        }

        const currentCard = Array.from(detectedCards)[f] || "Credit Card";
        const fileTxs = processTransactions(combinedRawText, currentCard);
        allTransactions.push(...fileTxs);
      }

      globalTransactions = allTransactions;
      globalFileCount = files.length;
      globalCardNames = Array.from(detectedCards);
      
      globalMonth = "Consolidated";
      globalYear = "";
      if (detectedPeriodEnd) {
        globalMonth = detectedPeriodEnd.toLocaleString('en-US', { month: 'long' });
        globalYear = detectedPeriodEnd.getFullYear();
      } else if (allTransactions.length > 0) {
        let maxDate = new Date(Math.max.apply(null, allTransactions.map(t => t.rawDateObj)));
        globalMonth = maxDate.toLocaleString('en-US', { month: 'long' });
        globalYear = maxDate.getFullYear();
      }

      switchView('view-upload', 'view-dashboard');
      
      const cardsTitle = globalCardNames.length > 0 ? globalCardNames.join(" & ") : "Credit Card";
      const headerLabelText = globalFileCount > 1 
        ? `${cardsTitle} · Consolidated Analysis` 
        : `${cardsTitle} · Statement Analysis`;
        
      document.getElementById('main-header-label').innerText = headerLabelText;
      document.getElementById('main-header-title').innerText = `${globalMonth} ${globalYear} Dashboard`;

      const safeCards = cardsTitle.replace(/[^a-zA-Z0-9]+/g, '_');
      currentExportFilename = `${safeCards}_${globalMonth}_${globalYear}_Dashboard`;

      renderDashboardCore(globalTransactions);
    });

    function extractCardName(page1Text) {
      const hsbcMatch = page1Text.match(/HSBC\s+([A-Za-z0-9+\s]+?)\s+Credit\s+Card/i);
      if (hsbcMatch && hsbcMatch[1]) {
        const variant = hsbcMatch[1].trim().replace(/\s+/g, ' ');
        if (!variant.toLowerCase().includes("bank")) return `HSBC ${variant} Card`;
      }
      if (/CBD\s+Super\s+Saver/i.test(page1Text)) return "CBD Super Saver Card";
      if (/Emirates\s+NBD/i.test(page1Text)) return "Emirates NBD Card";
      if (/Citibank/i.test(page1Text)) return "Citibank Card";
      if (/HSBC/i.test(page1Text)) return "HSBC Card";
      return "Credit Card";
    }

    function extractStatementPeriodEnd(page1Text) {
      const match = page1Text.match(/Statement\s+Period:\s*From\s+\d{1,2}\s+[A-Za-z]+\s+\d{2,4}\s+to\s+(\d{1,2})\s+([A-Za-z]+)\s+(\d{2,4})/i);
      if (match) {
        const day = match[1].padStart(2, '0');
        const month = match[2];
        const year = match[3].length === 2 ? `20${match[3]}` : match[3];
        const d = new Date(`${day} ${month} ${year}`);
        if (!isNaN(d.getTime())) return d;
      }
      return null;
    }

    function formatStandardDate(rawDate) {
      const cleaned = rawDate.replace(/^-|-$/g, '');
      const m = cleaned.match(/^(\d{1,2})-([a-zA-Z]{3,4})-?(\d{2})$/);
      if (!m) return cleaned;
      const day = m[1].padStart(2, '0');
      let mon = m[2];
      if (mon.toLowerCase() === 'sept') mon = 'Sep';
      return `${day} ${mon} 20${m[3]}`;
    }

    function formatMerchant(merchant, amount) {
      const m = merchant.toLowerCase();
      if (m.includes("digital dubai") || m.includes("dubai digital") || m.includes("smart dubai") || /\brta\b/.test(m)) {
        if ([262.5, 735, 1365].includes(amount)) return "Parkin Subscription";
        if (amount > 150) return "RTA (Traffic Fine)";
        if ([50, 75, 100, 120].includes(amount)) return "Digital Dubai (Salik Recharge)";
        if (amount === 220) return "Dubai Digital Authority (Govt Fee)";
        if (amount % 1 !== 0) return "Digital Dubai (Parkin Payment)";
        return "Digital Dubai (Nol Card Recharge)";
      }
      return merchant;
    }

    function processTransactions(text, cardName) {
      text = text.replace(/\s+/g, ' ');
      const dateRegex = /(\d{1,2}-[a-zA-Z]{3,4}-?\d{2}-?)/g;
      const parts = text.split(dateRegex);
      
      let transactions = [];
      let currentDate = null;

      for (let i = 1; i < parts.length; i += 2) {
        let rawDate = parts[i];
        let block = parts[i+1] ? parts[i+1].trim() : '';

        if (block.length < 2) {
          if (!currentDate) currentDate = rawDate;
          continue;
        }

        if (!currentDate) currentDate = rawDate;
        let lowerBlock = block.toLowerCase();
        
        if (lowerBlock.includes("opening balance") || lowerBlock.includes("closing balance") ||
            lowerBlock.includes("total amount due") || lowerBlock.includes("payment received") ||
            lowerBlock.includes("cashback") || lowerBlock.includes("issuer dcc credit") ||
            lowerBlock.includes("revrsl of stnd proc")) {
          currentDate = null;
          continue;
        }

        const amounts = block.match(/[\d,]+\.\d{2}/g);
        if (!amounts) { currentDate = null; continue; }

        let amountStr = amounts[amounts.length - 1];
        let afterAmount = block.substring(block.lastIndexOf(amountStr) + amountStr.length);
        if (/\bCR\b/i.test(afterAmount)) { currentDate = null; continue; }

        let amount = parseFloat(amountStr.replace(/,/g, ''));
        let merchant = block.substring(0, block.lastIndexOf(amountStr)).trim();

        merchant = merchant.replace(/NFC\s*-\s*\(AP-PAY\)-|IAP\s*-\s*\(AP-PAY\)-/ig, '').trim();
        merchant = merchant.replace(/VA USD\/AED.*$/i, '');
        merchant = merchant.replace(/USD\/AED.*$/i, '');
        merchant = merchant.replace(/FOREIGN CURRENCY PROCESSING FEE.*$/i, '');
        merchant = merchant.replace(/STND PROC\. FEE.*$/i, '');
        merchant = merchant.replace(/ISSUER DCC DEBIT.*$/i, '');
        merchant = merchant.replace(/\s+[A-Z]{3}\s+[\d,]+\.\d{2}.*$/i, '');
        merchant = merchant.replace(/\s+[\d,]+\.\d{2}\s+[A-Z]{3}.*$/i, '');
        merchant = merchant.replace(/Page \d+.*$/i, '');
        merchant = merchant.replace(/HSBC Bank Middle East.*$/i, '');
        merchant = merchant.replace(/[-\s]+$/, '').trim(); 

        if (merchant.length > 0) {
          const originalM = formatMerchant(merchant, amount);
          const stdDate = formatStandardDate(currentDate);
          const txId = btoa(`${stdDate}|${originalM}|${amount}`).replace(/=/g, '');

          const finalM = merchantAliases[originalM] || originalM;

          transactions.push({
            txId: txId,
            date: stdDate,
            rawDateObj: new Date(stdDate),
            merchant: finalM,
            amount: amount,
            category: categorize(finalM, amount),
            card: cardName
          });
        }
        currentDate = null;
      }
      return transactions;
    }

          m.includes("careem deliveries") || m.includes("keeta") || m.includes("deliveroo") ||

          m.includes("cookie dealer") || m.includes("fusion") || m.includes("bebax") || m.includes("chefs") ||
          m.includes("daves hot chicken") || m.includes("koukh al shay") || m.includes("kfc") || 
          m.includes("subway") || m.includes("hardee") || m.includes("jollibee") || m.includes("nando") ||
          m.includes("bateel") || m.includes("czn") || m.includes("texas roadhouse") || m.includes("shake shack") ||
          m.includes("five guys") || m.includes("salt ") || m.includes("din tai fung") || m.includes("paul ") ||
          m.includes("baskin") || m.includes("cold stone")) return "Dining & Cafes";

      if (m.includes("supermarket") || m.includes("grocery") || m.includes("carrefour") || 
          m.includes("spinneys") || m.includes("lulu") || m.includes("choithrams") || m.includes("waitrose") ||
          m.includes("fresh day") || m.includes("zahra al lotus") || m.includes("union coop") ||
          m.includes("nesto") || m.includes("viva ") || m.includes("al maya") || m.includes("baqer mohebi") ||
          m.includes("day to day") || m.includes("kibsons") || m.includes("barakat") || m.includes("noon grocery") ||
          m.includes("talabat mart")) return "Groceries";

      // Expanded UAE Retail & Shopping
      if (m.includes("amazon") || m.includes("noon") || m.includes("namshi") || m.includes("ounass") ||

          m.includes("apple") || m.includes("adidas") || m.includes("nike") || m.includes("centerpoint") ||

          m.includes("dubai mall") || m.includes("moe") || m.includes("mall") || m.includes("boutique") || 
          m.includes("store")) return "Shopping";

      if (m.includes("tiger strikes") || m.includes("billiards") || m.includes("bowling") || 
          m.includes("que club") || m.includes("cinema") || m.includes("vox") || m.includes("roxy") || 
          m.includes("reel") || m.includes("topgolf") || m.includes("global village") ||

          m.includes("flydubai") || m.includes("etihad") || m.includes("swiss") || m.includes("norwegian")) return "Travel & Stays";

          m.includes("ibrahem al qurashi") || m.includes("sephora") || m.includes("binsina") || 
          m.includes("boots") || m.includes("thumbay") || m.includes("nmc ") || m.includes("mediclinic")) return "Personal Care";

          m.includes("courier") || m.includes("master key")) return "Services & Freight";

      if (m.includes("careem plus") || m.includes("subscription") || m.includes("netflix") || 
          m.includes("spotify") || m.includes("gymnation") || m.includes("icloud")) return "Subscriptions";

      return "Misc & Other";
    }

    function calculateMoM(txs) {
      const monthTotals = {};
      txs.forEach(t => {
        if(reimbursableFlags[t.txId]) return;
        const d = t.rawDateObj;
        const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        if(!monthTotals[key]) monthTotals[key] = 0;
        monthTotals[key] += t.amount;
      });
      
      const sortedKeys = Object.keys(monthTotals).sort(); 
      if(sortedKeys.length >= 2) {
        const latest = monthTotals[sortedKeys[sortedKeys.length-1]];
        const prev = monthTotals[sortedKeys[sortedKeys.length-2]];
        if(prev === 0) return "";
        const pct = ((latest - prev) / prev) * 100;
        const sign = pct > 0 ? "▲" : "▼";
        const trendClass = pct > 0 ? "trend-up" : "trend-down";
        return `<div class="trend-badge ${trendClass}">${sign} ${Math.abs(pct).toFixed(1)}% vs prior mo</div>`;
      }
      return "";
    }

    function renderDashboardCore(txs) {
      const output = document.getElementById('dashboard-output');
      
      if (txs.length === 0) {
        output.innerHTML = "<div style='text-align:center; padding: 30px 0; color: #94A3B8;'>No transactions match your search.</div>";
        return;
      }

      let totalSpend = 0, usualTotal = 0, oneTimeTotal = 0, usualCount = 0, oneTimeCount = 0;
      let reimbursableTotal = 0;
      let catData = {};
      let reimbursableItems = [];

      txs.forEach(t => {
        if (reimbursableFlags[t.txId]) {
          reimbursableTotal += t.amount;
          reimbursableItems.push(t);
          return;
        }

        totalSpend += t.amount;
        if (oneTimeCategories.includes(t.category)) {
          oneTimeTotal += t.amount;
          oneTimeCount++;
        } else {
          usualTotal += t.amount;
          usualCount++;
        }

        if (!catData[t.category]) catData[t.category] = { total: 0, items: [] };
        catData[t.category].total += t.amount;
        catData[t.category].items.push(t);
      });

      let usualPct = totalSpend > 0 ? ((usualTotal / totalSpend) * 100).toFixed(1) : 0;
      let oneTimePct = totalSpend > 0 ? ((oneTimeTotal / totalSpend) * 100).toFixed(1) : 0;
      let uniqueDays = [...new Set(txs.map(t => t.date))].length;
      let dailyAvg = uniqueDays > 0 ? Math.round(totalSpend / uniqueDays) : Math.round(totalSpend / 30);
      let sortedCats = Object.entries(catData).sort((a, b) => b[1].total - a[1].total);
      
      const cardsTitle = globalCardNames.length > 0 ? globalCardNames.join(" & ") : "Credit Card";
      const cardBoxTitle = globalFileCount > 1 ? "Consolidated Outflows" : "Statement Outflows";
      
      const searchTerm = document.getElementById('search-input').value;
      let cardBoxSub = globalFileCount > 1 
        ? `Parsed across ${globalFileCount} statements (${cardsTitle})` 
        : `${cardsTitle} · Parsed from PDF`;
      if(searchTerm) cardBoxSub = `Showing search results for "${searchTerm}"`;

      const trendHtml = calculateMoM(txs);

      let html = `
        <div class="main-card">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
            <div>
              <div class="card-title">${cardBoxTitle}</div>
              <div class="card-subtitle" style="margin-bottom: 0;">${cardBoxSub}</div>
            </div>
            ${trendHtml}
          </div>

          <div class="card-total">AED ${totalSpend.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
          
          <div class="progress-bar">
      `;

      sortedCats.forEach(([cName, cObj]) => {
        const meta = categoryMeta[cName] || { color: "#A855F7" };
        const pct = totalSpend > 0 ? ((cObj.total / totalSpend) * 100).toFixed(1) : 0;
        html += `<div class="progress-segment" style="width: ${pct}%; background: ${meta.color};" title="${cName}: ${pct}%"></div>`;
      });
      
      html += `</div>`;
      
      if (reimbursableTotal > 0) {
        html += `<div style="text-align:right; font-size:10px; color:#60A5FA; font-weight:700; margin-top: 10px;">+ AED ${reimbursableTotal.toLocaleString('en-US', {minimumFractionDigits: 2})} flagged as Corporate/Reimbursable</div>`;
      }
        
      html += `</div>`;
        
      html += `
        <div class="split-grid">
          <div class="split-card recurring">
            <div class="split-label">Usual Spends</div>
            <div class="split-value">AED ${usualTotal.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
            <div class="split-desc">${usualPct}% · ${usualCount} Txs</div>
          </div>
          <div class="split-card onetime">
            <div class="split-label">One-Time Spends</div>
            <div class="split-value">AED ${oneTimeTotal.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
            <div class="split-desc">${oneTimePct}% · ${oneTimeCount} Txs</div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-num">AED ${dailyAvg}</div>
            <div class="stat-lbl">Daily Avg</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">${totalSpend > 0 ? txs.length - reimbursableItems.length : 0}</div>
            <div class="stat-lbl">Txn Count</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" style="color: ${sortedCats[0] ? (categoryMeta[sortedCats[0][0]]?.color || '#EC4899') : '#EC4899'};">
              ${sortedCats[0] ? ((sortedCats[0][1].total / totalSpend)*100).toFixed(1) : 0}%
            </div>
            <div class="stat-lbl">Top: ${sortedCats[0] ? sortedCats[0][0].split(' ')[0] : 'N/A'}</div>
          </div>
        </div>
      `;

      if(!searchTerm) {
        html += `<div class="header-label" style="margin-bottom: 12px; display:flex; justify-content:space-between;">
          <span>Tap category to inspect</span>
          <span>Tap 💼 to flag reimbursable</span>
        </div>`;
      }

      const renderCategoryBlock = (cName, cTotal, itemsArray, metaOverrides = null, defaultOpen = false) => {
        const meta = metaOverrides || categoryMeta[cName] || { icon: "🧾", color: "#A855F7" };
        const pct = totalSpend > 0 && !metaOverrides ? ((cTotal / totalSpend) * 100).toFixed(1) : 0;
        const pctDisplay = metaOverrides ? "---" : `${pct}%`;
        
        let itemsHtml = "";
        itemsArray.sort((a, b) => b.amount - a.amount).forEach(item => {
          const cardTag = globalFileCount > 1 ? ` · ${item.card.replace(' Card', '')}` : '';
          const isFlagged = reimbursableFlags[item.txId] ? 'flagged' : '';
          const rowClass = isFlagged ? 'is-flagged' : '';
          
          itemsHtml += `
            <div class="merchant-item ${rowClass}">
              <div class="m-left">
                <div class="flag-btn ${isFlagged}" onclick="toggleFlag('${item.txId}')">💼</div>
                <div style="display:flex; flex-direction:column;">
                  <span class="m-name" onclick="renameMerchant(this)">${item.merchant}</span>
                  <span class="m-date">${item.date}${cardTag}</span>
                </div>
              </div>
              <div class="m-amt">AED ${item.amount.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
            </div>`;
        });

        return `
          <details style="--cat-color: ${meta.color};" ${searchTerm || defaultOpen ? 'open' : ''}>
            <summary>
              <div class="cat-left"><span class="cat-icon">${meta.icon}</span><div><div class="cat-name">${cName}</div><div class="cat-count">${itemsArray.length} tx</div></div></div>
              <div class="cat-right"><div class="cat-amount">AED ${cTotal.toLocaleString('en-US', {minimumFractionDigits: 2})}</div><div class="cat-pct" style="color:${metaOverrides ? '#94A3B8' : ''}">${pctDisplay}</div></div>
            </summary>
            ${!metaOverrides ? `<div class="cat-bar-bg"><div class="cat-bar-fill" style="width: ${pct}%;"></div></div>` : ''}
            <div class="details-wrapper"><div class="merchants-list">${itemsHtml}</div></div>
          </details>`;
      };

      sortedCats.forEach(([cName, cObj]) => {
        html += renderCategoryBlock(cName, cObj.total, cObj.items);
      });

      if (reimbursableItems.length > 0) {
        html += `<div style="margin-top:20px;"></div>`; 
        html += renderCategoryBlock("Reimbursable & Corporate", reimbursableTotal, reimbursableItems, categoryMeta["Reimbursable"]);
      }

      html += `<div class="footer" style="margin-top:28px;">${cardsTitle} · ${globalMonth} ${globalYear} · ${APP_VERSION}</div>`;
      output.innerHTML = html;
    }
  </script>
